<!DOCTYPE html>
<html lang="es">
<head>
	<base target="_top">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro de asistencia</title>
	<style>
		:root { --ink: #071b3a; --muted: #52627a; --paper: #fff; --cream: #f2f6fb; --line: #d5dfeb; --accent: #0b2d5c; --success: #28734b; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--cream); font-family: Arial, sans-serif; }
		main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 48px 0; }
		.shell { padding: clamp(28px, 6vw, 58px); background: var(--paper); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(61, 45, 25, .14); }
		.eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
		h1 { margin: 0 0 30px; font: 400 clamp(2.4rem, 8vw, 4.8rem) Georgia, serif; line-height: .95; }
		.search { display: flex; gap: 10px; }
		.config { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
		.config label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: .8rem; font-weight: 700; }
		.config select { padding: 10px 12px; border: 1px solid var(--line); background: #f7faff; color: var(--ink); font: 700 1rem Arial, sans-serif; }
		.event-options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 18px; }
		.event-options button { color: var(--accent); background: #e8eef5; border: 1px solid var(--line); }
		.event-options button[aria-pressed="true"] { color: #fff; background: var(--accent); }
		input { min-width: 0; flex: 1; padding: 15px; color: var(--ink); border: 1px solid var(--line); font: 1.1rem Georgia, serif; text-transform: uppercase; }
		button { padding: 14px 18px; border: 0; color: #fff; background: var(--accent); cursor: pointer; font-weight: 700; }
		button:disabled { cursor: not-allowed; opacity: .45; }
		.camera-button { margin-top: 12px; background: var(--success); }
		.scanner { display: none; margin-top: 18px; }
		.scanner.visible { display: block; }
		video { display: block; width: 100%; max-height: 360px; background: var(--ink); object-fit: cover; }
		.stop-camera { margin-top: 10px; background: #a83232; }
		#status { min-height: 24px; margin: 18px 0 0; color: var(--muted); }
		#status.error { color: #a83232; }
		.card { display: none; margin-top: 28px; padding: 22px; background: #f4f7fb; border: 1px solid var(--line); }
		.card.visible { display: block; }
		.name { margin: 0 0 14px; font: 700 1.8rem Georgia, serif; }
		.data { display: grid; gap: 8px; color: var(--muted); }
		.actions { display: flex; gap: 10px; margin-top: 24px; }
		.actions .exit { background: var(--success); }
		.actions[hidden] { display: none; }
		.actions .already-registered { color: var(--ink); background: #dce5ef; opacity: 1; }
		@media (max-width: 560px) { .search, .actions { flex-direction: column; } }
	</style>
</head>
<body>
	<main>
		<section class="shell">
			<p class="eyebrow">Congreso Hela 2027</p>
			<h1>Registro de asistencia</h1>
			<div class="search">
				<input id="clave" type="text" placeholder="HELA-XXXXX" autocomplete="off" aria-label="Clave HELA">
				<button id="buscar" type="button">Buscar</button>
			</div>
			<div class="config">
				<label>
					Hoja
					<select id="hojaConferencia">
						<option value="LUNES">LUNES</option>
						<option value="MIERCOLES">MIERCOLES</option>
						<option value="VIERNES">VIERNES</option>
					</select>
				</label>
				<label>
					Movimiento
					<select id="tipoMovimiento">
						<option value="entrada">ENTRADA</option>
						<option value="comida">COMIDA</option>
						<option value="salida">SALIDA</option>
					</select>
				</label>
			</div>
			<div class="event-options" role="group" aria-label="Tipo de evento">
				<button type="button" data-evento="conferencias" aria-pressed="true">CONFERENCIAS</button>
			</div>
			<button id="abrirCamara" class="camera-button" type="button">Abrir cámara y escanear QR</button>
			<div id="scanner" class="scanner">
				<video id="video" playsinline muted></video>
				<button id="cerrarCamara" class="stop-camera" type="button">Cerrar cámara</button>
			</div>
			<p id="status" role="status"></p>
			<article id="card" class="card">
				<h2 id="nombre" class="name"></h2>
				<div class="data">
					<div>Clave: <strong id="claveVista"></strong></div>
					<div>Correo: <strong id="correo"></strong></div>
					<div id="entradaFila">Entrada: <strong id="entrada">No registrada</strong></div>
					<div id="comidaFila">Comida: <strong id="comida">No registrada</strong></div>
					<div id="salidaFila">Salida: <strong id="salida">No registrada</strong></div>
				</div>
				<div id="accionesAsistencia" class="actions" hidden>
					<button id="registrarEntrada" type="button">Registrar entrada</button>
					<button id="registrarComida" type="button">Registrar comida</button>
					<button id="registrarSalida" class="exit" type="button">Registrar salida</button>
				</div>
			</article>
		</section>
	</main>
	<canvas id="canvas" hidden></canvas>
	<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
	<script>
		const clave = document.getElementById('clave');
		const buscar = document.getElementById('buscar');
		const status = document.getElementById('status');
		const card = document.getElementById('card');
		const abrirCamara = document.getElementById('abrirCamara');
		const cerrarCamara = document.getElementById('cerrarCamara');
		const scanner = document.getElementById('scanner');
		const video = document.getElementById('video');
		const canvas = document.getElementById('canvas');
		const contextoCanvas = canvas.getContext('2d', { willReadFrequently: true });
		const accionesAsistencia = document.getElementById('accionesAsistencia');
		const hojaConferencia = document.getElementById('hojaConferencia');
		const tipoMovimiento = document.getElementById('tipoMovimiento');
		const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzbKcyR7CvN47Zd22A7I-fa1ZVWEEZWQSKiblGLFDx6nsIvCsznemwIvwqAsB1WAMjV/exec';
		
		const CONFIGURACION_ASISTENCIA = {
			hoja: 'LUNES',
			tipo: 'entrada'
		};
		
		let registroActual = null;
		let eventoActual = 'conferencias';
		let hojaActual = CONFIGURACION_ASISTENCIA.hoja;
		let tipoMovimientoActual = CONFIGURACION_ASISTENCIA.tipo;
		hojaConferencia.value = hojaActual;
		tipoMovimiento.value = tipoMovimientoActual;
		let streamCamara = null;
		let intervaloEscaneo = null;

		function mostrarRegistro(registro) {
			registroActual = registro;
			document.getElementById('nombre').textContent = registro.nombre;
			document.getElementById('claveVista').textContent = registro.clave;
			document.getElementById('correo').textContent = registro.correo;
			document.getElementById('entrada').textContent = formatoFecha(registro.entrada);
			document.getElementById('comida').textContent = formatoFecha(registro.comida);
			document.getElementById('salida').textContent = formatoFecha(registro.salida);
			const botonEntrada = document.getElementById('registrarEntrada');
			const botonComida = document.getElementById('registrarComida');
			const botonSalida = document.getElementById('registrarSalida');
			botonEntrada.disabled = Boolean(registro.entrada);
			botonComida.disabled = Boolean(registro.comida);
			botonSalida.disabled = Boolean(registro.salida);
			botonEntrada.textContent = registro.entrada ? 'ENTRADA YA REGISTRADA' : 'Registrar entrada';
			botonComida.textContent = registro.comida ? 'COMIDA YA REGISTRADA' : 'Registrar comida';
			botonSalida.textContent = registro.salida ? 'SALIDA YA REGISTRADA' : 'Registrar salida';
			document.getElementById('entradaFila').hidden = registro.evento !== 'conferencias';
			document.getElementById('comidaFila').hidden = registro.evento !== 'conferencias';
			document.getElementById('salidaFila').hidden = registro.evento !== 'conferencias';
			accionesAsistencia.hidden = true;
			card.classList.add('visible');
		}

		function formatoFecha(valor) { return valor ? new Date(valor).toLocaleString('es-MX') : 'No registrada'; }

		function textoMovimiento(tipo, registrado) {
			const nombres = { entrada: 'Entrada', comida: 'Comida', salida: 'Salida' };
			return nombres[tipo] + (registrado ? ' ya estaba registrada.' : ' registrada.');
		}

		function consultarApi(accion, parametros) {
			return new Promise((resolve, reject) => {
				const callback = '__asistenciaCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
				const script = document.createElement('script');
				const consulta = new URLSearchParams({ ...parametros, accion, callback });
				const timeout = setTimeout(() => {
					console.error('Apps Script timeout:', API_ENDPOINT);
					terminar(new Error('El servidor tardó demasiado en responder. Revisa que la Web App de Apps Script esté publicada y que la URL sea la correcta.'));
				}, 30000);
				const terminar = (error, resultado) => {
					clearTimeout(timeout);
					delete window[callback];
					script.remove();
					if (error) reject(error);
					else if (resultado && resultado.error) reject(new Error(resultado.error));
					else resolve(resultado);
				};
				window[callback] = (resultado) => terminar(null, resultado);
				script.onerror = () => terminar(new Error('No se pudo conectar con el servidor de asistencia.'));
				script.src = API_ENDPOINT + '?' + consulta.toString();
				document.body.appendChild(script);
			});
		}

		function enviarAccionApi(solicitud) {
			fetch(API_ENDPOINT, {
				method: 'POST',
				mode: 'no-cors',
				headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
				body: JSON.stringify(solicitud)
			}).catch(() => {});
		}

		async function esperarConferencia(claveUsuario, condicion, evento, hoja) {
			const limite = Date.now() + 15000;
			while (Date.now() < limite) {
				const registro = await consultarApi('buscarAsistencia', { clave: claveUsuario, evento, hoja: hoja || hojaActual });
				if (condicion(registro)) return registro;
				await new Promise(resolve => setTimeout(resolve, 400));
			}
			throw new Error('La hoja tardó demasiado en confirmar el registro. Actualiza e intenta de nuevo.');
		}

		function extraerClaveQr(valor) {
			const coincidencia = String(valor || '').toUpperCase().match(/HELA-\d{5}/);
			return coincidencia ? coincidencia[0] : '';
		}

		async function abrirLectorQr() {
			if (!navigator.mediaDevices || !window.jsQR && !('BarcodeDetector' in window)) {
				status.className = 'error';
				status.textContent = 'Este navegador no permite abrir la cámara. Escribe la clave HELA manualmente.';
				return;
			}

			const politicaCamara = document.permissionsPolicy || document.featurePolicy;
			if (politicaCamara && typeof politicaCamara.allowsFeature === 'function' && !politicaCamara.allowsFeature('camera')) {
				status.className = 'error';
				status.textContent = 'Google Apps Script bloquea la cámara en vivo dentro de esta página. Para escanear, abre el registro desde un sitio HTTPS fuera de Apps Script.';
				return;
			}

			try {
				try {
					streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
				} catch (error) {
					if (error.name === 'NotAllowedError' || error.name === 'SecurityError') throw error;
					streamCamara = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
				}
				video.srcObject = streamCamara;
				scanner.classList.add('visible');
				await video.play();
				const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
				intervaloEscaneo = setInterval(async () => {
					if (video.readyState < 2) return;
					let valorDetectado = '';
					if (detector) {
						const codigos = await detector.detect(video);
						valorDetectado = codigos[0] && codigos[0].rawValue;
					} else {
						canvas.width = video.videoWidth;
						canvas.height = video.videoHeight;
						contextoCanvas.drawImage(video, 0, 0, canvas.width, canvas.height);
						const imagen = contextoCanvas.getImageData(0, 0, canvas.width, canvas.height);
						const codigo = window.jsQR(imagen.data, imagen.width, imagen.height, { inversionAttempts: 'dontInvert' });
						valorDetectado = codigo && codigo.data;
					}
					const claveDetectada = extraerClaveQr(valorDetectado);
					if (claveDetectada) {
						clave.value = claveDetectada;
						cerrarLectorQr();
						buscarRegistro();
					}
				}, 250);
			} catch (error) {
				cerrarLectorQr();
				status.className = 'error';
				if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
					status.textContent = 'El navegador bloqueó el permiso de cámara. Permítelo en la configuración del sitio.';
				} else if (error.name === 'NotFoundError') {
					status.textContent = 'No se encontró una cámara conectada.';
				} else if (error.name === 'NotReadableError') {
					status.textContent = 'La cámara está ocupada por otra aplicación. Ciérrala y vuelve a intentar.';
				} else {
					status.textContent = 'No se pudo abrir la cámara (' + (error.name || 'error') + ').';
				}
			}
		}

		function cerrarLectorQr() {
			if (intervaloEscaneo) clearInterval(intervaloEscaneo);
			intervaloEscaneo = null;
			if (streamCamara) streamCamara.getTracks().forEach(track => track.stop());
			streamCamara = null;
			video.srcObject = null;
			scanner.classList.remove('visible');
		}

		async function buscarRegistro() {
			status.className = '';
			status.textContent = 'Buscando...';
			card.classList.remove('visible');
			try {
				const registro = await consultarApi('buscarAsistencia', { clave: clave.value, evento: eventoActual, hoja: hojaActual });
				const nombreMovimiento = { entrada: 'entrada', comida: 'comida', salida: 'salida' }[tipoMovimientoActual] || tipoMovimientoActual;
				status.textContent = 'Usuario encontrado. Registrando ' + nombreMovimiento + ' en ' + hojaActual + '...';
				mostrarRegistro(registro);
				await registrarMovimiento(tipoMovimientoActual, true);
			} catch (error) {
				status.className = 'error';
				status.textContent = error.message || 'No se pudo consultar el registro.';
			}
		}

		function elegirEvento(evento, boton) {
			eventoActual = evento;
			document.querySelectorAll('[data-evento]').forEach(opcion => {
				opcion.setAttribute('aria-pressed', String(opcion === boton));
			});
			card.classList.remove('visible');
			if (/^HELA-\d{5}$/i.test(clave.value.trim())) buscarRegistro();
		}

		async function registrarMovimiento(tipo, autoGuardar = false) {
			status.className = '';
			status.textContent = 'Guardando movimiento...';
			try {
				const actual = await consultarApi('buscarAsistencia', { clave: registroActual.clave, evento: eventoActual, hoja: hojaActual });
				if (actual[tipo]) {
					status.textContent = autoGuardar ? 'El usuario ya tiene ' + tipo + ' registrada en ' + hojaActual + '.' : textoMovimiento(tipo, true);
					mostrarRegistro(actual);
					return;
				}

				enviarAccionApi({ accion: 'registrarMovimientoAsistencia', clave: registroActual.clave, tipo, evento: eventoActual, hoja: hojaActual });
				const registro = await esperarConferencia(registroActual.clave, actualizada => Boolean(actualizada[tipo]), eventoActual, hojaActual);
				status.textContent = autoGuardar ? 'Asistencia registrada en ' + hojaActual + ' (' + tipo + ').' : textoMovimiento(tipo, false);
				mostrarRegistro(registro);
			} catch (error) {
				status.className = 'error';
				status.textContent = error.message || 'No se pudo guardar el movimiento.';
			}
		}

		buscar.addEventListener('click', buscarRegistro);
		document.querySelectorAll('[data-evento]').forEach(boton => {
			boton.addEventListener('click', () => elegirEvento(boton.dataset.evento, boton));
		});
		hojaConferencia.addEventListener('change', () => {
			hojaActual = hojaConferencia.value;
			if (/^HELA-\d{5}$/i.test(clave.value.trim())) buscarRegistro();
		});
		tipoMovimiento.addEventListener('change', () => {
			tipoMovimientoActual = tipoMovimiento.value;
			if (registroActual) {
				status.textContent = 'Movimiento activo: ' + tipoMovimientoActual + ' en ' + hojaActual + '.';
			}
		});
		abrirCamara.addEventListener('click', abrirLectorQr);
		cerrarCamara.addEventListener('click', cerrarLectorQr);
		clave.addEventListener('keydown', (event) => { if (event.key === 'Enter') buscarRegistro(); });
		document.getElementById('registrarEntrada').addEventListener('click', () => registrarMovimiento('entrada'));
		document.getElementById('registrarComida').addEventListener('click', () => registrarMovimiento('comida'));
		document.getElementById('registrarSalida').addEventListener('click', () => registrarMovimiento('salida'));
	</script>
</body>
</html>
