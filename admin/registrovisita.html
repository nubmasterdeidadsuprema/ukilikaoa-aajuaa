<!DOCTYPE html>
<html lang="es">
<head>
	<base target="_top">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro de visitas</title>
	<style>
		:root { --ink: #071b3a; --muted: #52627a; --paper: #fff; --cream: #f2f6fb; --line: #d5dfeb; --accent: #0b2d5c; --success: #28734b; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--cream); font-family: Arial, sans-serif; }
		main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 48px 0; }
		.shell { padding: clamp(28px, 6vw, 58px); background: var(--paper); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(61, 45, 25, .14); }
		.eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
		h1 { margin: 0 0 30px; font: 400 clamp(2.4rem, 8vw, 4.8rem) Georgia, serif; line-height: .95; }
		.search { display: flex; gap: 10px; }
		input { min-width: 0; flex: 1; padding: 15px; color: var(--ink); border: 1px solid var(--line); font: 1.1rem Georgia, serif; text-transform: uppercase; }
		button { padding: 14px 18px; border: 0; color: #fff; background: var(--accent); cursor: pointer; font-weight: 700; }
		button:disabled { cursor: wait; opacity: .55; }
		#status { min-height: 24px; margin: 18px 0 0; color: var(--muted); }
		#status.error { color: #a83232; }
		.card { display: none; margin-top: 28px; padding: 22px; background: #f4f7fb; border: 1px solid var(--line); }
		.card.visible { display: block; }
		.name { margin: 0 0 14px; font: 700 1.8rem Georgia, serif; }
		.data { display: grid; gap: 8px; color: var(--muted); }
		@media (max-width: 560px) { .search { flex-direction: column; } }
	</style>
</head>
<body>
	<main>
		<section class="shell">
			<p class="eyebrow">Congreso Hela 2027</p>
			<h1>Registro de visitas</h1>
			<div class="search">
				<input id="clave" type="text" placeholder="HELA-XXXXX" autocomplete="off" aria-label="Clave HELA">
				<button id="buscar" type="button">Registrar entrada</button>
			</div>
			<p id="status" role="status" aria-live="polite"></p>
			<article id="card" class="card">
				<h2 id="nombre" class="name"></h2>
				<div class="data">
					<div>Clave: <strong id="claveVista"></strong></div>
					<div>Correo: <strong id="correo"></strong></div>
					<div>Visita asignada: <strong id="visita"></strong></div>
					<div>Entrada: <strong id="entrada">No registrada</strong></div>
				</div>
			</article>
		</section>
	</main>
	<script>
		const clave = document.getElementById('clave');
		const buscar = document.getElementById('buscar');
		const status = document.getElementById('status');
		const card = document.getElementById('card');
		const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyQGjeiehgdx96RSedZIm7znpyPI3nFcoZQEGlDrFxZQDGCzM8VwGTwxx_j9AujN2rQ/exec';
		
        let procesando = false;

		function consultarApi(accion, parametros) {
			return new Promise((resolve, reject) => {
				const callback = '__asistenciaCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
				const script = document.createElement('script');
				const consulta = new URLSearchParams({ ...parametros, accion, callback });
				const timeout = setTimeout(() => terminar(new Error('El servidor tardó demasiado. Revisa que la Web App de Apps Script esté desplegada con acceso para cualquiera.')), 20000);
				const terminar = (error, resultado) => {
					clearTimeout(timeout);
					delete window[callback];
					script.remove();
					if (error) reject(error);
					else if (resultado && resultado.error) reject(new Error(resultado.error));
					else resolve(resultado);
				};
				window[callback] = resultado => terminar(null, resultado);
				script.onerror = () => terminar(new Error('No se pudo conectar con el servidor de asistencia.'));
				script.src = API_ENDPOINT + '?' + consulta.toString();
				document.body.appendChild(script);
			});
		}

		function enviarRegistro(claveUsuario) {
			return fetch(API_ENDPOINT, {
				method: 'POST',
				mode: 'no-cors',
				headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
				body: JSON.stringify({ accion: 'registrarEntradaVisita', clave: claveUsuario })
			});
		}

		function mostrarRegistro(registro) {
			document.getElementById('nombre').textContent = registro.nombre || '';
			document.getElementById('claveVista').textContent = registro.clave || '';
			document.getElementById('correo').textContent = registro.correo || '';
			document.getElementById('visita').textContent = registro.visita || registro.hoja || '';
			document.getElementById('entrada').textContent = registro.entrada ? new Date(registro.entrada).toLocaleString('es-MX') : 'No registrada';
			card.classList.add('visible');
		}

		async function esperarRegistro(claveUsuario) {
			const limite = Date.now() + 20000;
			while (Date.now() < limite) {
				const registro = await consultarApi('buscarAsistenciaVisita', { clave: claveUsuario });
				if (registro.entrada) return registro;
				await new Promise(resolve => setTimeout(resolve, 600));
			}
			throw new Error('No se confirmó la entrada en la hoja de VISITAS. Revisa la conexión y vuelve a consultar.');
		}

		async function registrar() {
			if (procesando) return;
			const claveUsuario = String(clave.value || '').trim().toUpperCase();
			if (!/^HELA-\d{5}$/.test(claveUsuario)) {
				status.className = 'error';
				status.textContent = 'Escribe una clave con formato HELA-12345.';
				return;
			}

			procesando = true;
			buscar.disabled = true;
			status.className = '';
			status.textContent = 'Buscando usuario en VISITAS...';
			card.classList.remove('visible');
			try {
				clave.value = claveUsuario;
				const actual = await consultarApi('buscarAsistenciaVisita', { clave: claveUsuario });
				mostrarRegistro(actual);
				if (actual.entrada) {
					status.textContent = 'La entrada ya estaba registrada para ' + actual.visita + '.';
					return;
				}

				status.textContent = 'Registrando ENTRADA en ' + actual.visita + '...';
				await enviarRegistro(claveUsuario);
				const confirmado = await esperarRegistro(claveUsuario);
				mostrarRegistro(confirmado);
				status.textContent = 'ENTRADA registrada en ' + confirmado.visita + '.';
			} catch (error) {
				status.className = 'error';
				status.textContent = error.message || 'No se pudo registrar la entrada.';
			} finally {
				procesando = false;
				buscar.disabled = false;
			}
		}

		buscar.addEventListener('click', registrar);
		clave.addEventListener('keydown', event => { if (event.key === 'Enter') registrar(); });
	</script>
</body>
</html>
